<h2 class="sr-only">BCA Bank Statement to Excel Converter</h2>
<style>
/* Style tetap dipertahankan agar UI tidak berubah */
.wrap{padding:1.5rem 0;max-width:680px;font-family:sans-serif}
.hdr h1{font-size:20px;font-weight:500;margin:0 0 4px;color:#333}
.hdr p{font-size:14px;color:#666;margin:0 0 1.25rem}
.drop{border:0.5px dashed #ccc;border-radius:12px;padding:2rem;text-align:center;cursor:pointer;background:#f9f9f9;transition:background .15s;margin-bottom:1rem}
.drop:hover{background:#f0f0f0}
.drop input{display:none}
.drop-icon{font-size:28px;margin-bottom:8px}
.drop-lbl{font-size:14px;color:#666}
.scard{background:#fff;border:0.5px solid #eee;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.srow{display:flex;align-items:center;gap:10px;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:#ccc}
.dot.proc{background:#378ADD;animation:pulse 1s infinite}
.dot.ok{background:#1D9E75}
.dot.err{background:#E24B4A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.log{font-size:12px;color:#666;margin-top:8px;font-family:monospace;max-height:150px;overflow-y:auto;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:0.5px solid #ccc;background:transparent;font-size:14px;cursor:pointer}
.btnp{background:#333;color:#fff;border-color:transparent}
</style>

<div class="wrap">
  <div class="hdr">
    <h1>BCA statement → Excel (Fixed)</h1>
    <p>Unggah file PDF e-statement BCA untuk konversi otomatis ke format Excel.</p>
  </div>
  <div class="drop" id="dz">
    <input type="file" id="fi" multiple accept=".pdf">
    <div class="drop-icon">📄</div>
    <div class="drop-lbl"><strong>Klik untuk pilih file</strong> atau drag & drop<br>File PDF E-Statement BCA</div>
  </div>
  <div id="pills" style="margin-bottom:8px"></div>
  <div class="scard">
    <div class="srow"><div class="dot" id="dot"></div><span id="stxt">Ready — Unggah file untuk memulai</span></div>
    <div class="log" id="logel"></div>
  </div>
  <div class="acts">
    <button class="btn btnp" id="genBtn" disabled>Generate Excel</button>
    <button class="btn" id="clrBtn">Clear</button>
  </div>
  <div id="rsec"></div>
</div>

<!-- Library Utama: pdf.js untuk PDF dan xlsx untuk Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

const files = {};
const MONTH_MAP = {JANUARI:1,FEBRUARI:2,MARET:3,APRIL:4,MEI:5,JUNI:6,JULI:7,AGUSTUS:8,SEPTEMBER:9,OKTOBER:10,NOVEMBER:11,DESEMBER:12};

// Logika Klasifikasi dari Skrip Python Anda
function classify(line, isCredit) {
  const u = line.toUpperCase();
  if (u.includes('BIAYA ADM')) return { ket: 'BIAYA ADM BANK', kode: '27' };
  if (u.includes('PAJAK BUNGA') || u.includes('PAJAK JASA GIRO')) return { ket: 'PAJAK JASA GIRO', kode: '' };
  if (u.trim().startsWith('BUNGA')) return { ket: 'BUNGA', kode: '' };
  if (u.includes('SETORAN TUNAI')) return { ket: 'SETORAN TUNAI', kode: '1' };
  if (u.includes('KR OTOMATIS') || u.includes('SWITCHING CR')) return { ket: 'PENERIMAAN PENJUALAN', kode: '5' };
  return isCredit ? { ket: 'PENERIMAAN PENJUALAN', kode: '5' } : { ket: 'PELUNASAN HUTANG DAGANG', kode: '' };
}

// Ekstraksi Teks menggunakan PDF.js (Pengganti JSZip)
async function extractText(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let text = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(item => item.str).join(" ") + "\n";
  }
  return text;
}

function parseText(text) {
  const lines = text.split('\n');
  const txs = [];
  const DATE_RE = /^(\d{2})\/(\d{2})\s+(.+)/;
  const AMT_RE = /([\d,]+\.\d{2})\s*(DB)?\s*(?:[\d,]+\.\d{2})?$/;

  let saldoAwal = 0, mutCR = 0, mutDB = 0, saldoAkhir = 0;

  lines.forEach(l => {
    // Parsing Summary
    if (l.includes('SALDO AWAL')) saldoAwal = parseFloat(l.match(/SALDO AWAL\s*:\s*([\d,]+\.\d+)/)?.[1].replace(/,/g,'') || 0);
    if (l.includes('MUTASI CR')) mutCR = parseFloat(l.match(/MUTASI CR\s*:\s*([\d,]+\.\d+)/)?.[1].replace(/,/g,'') || 0);
    if (l.includes('MUTASI DB')) mutDB = parseFloat(l.match(/MUTASI DB\s*:\s*([\d,]+\.\d+)/)?.[1].replace(/,/g,'') || 0);
    if (l.includes('SALDO AKHIR')) saldoAkhir = parseFloat(l.match(/SALDO AKHIR\s*:\s*([\d,]+\.\d+)/)?.[1].replace(/,/g,'') || 0);

    // Parsing Transaksi
    const dm = l.match(DATE_RE);
    if (dm) {
      const rest = dm[3].trim();
      const am = rest.match(AMT_RE);
      if (am) {
        const amt = parseFloat(am[1].replace(/,/g, ''));
        const isDB = rest.includes(' DB ') || !!am[2];
        const isCR = rest.includes(' CR ') || rest.startsWith('SETORAN TUNAI') || rest.startsWith('BUNGA');
        
        const cls = classify(rest, isCR && !isDB);
        txs.push({
          date: `2025-${dm[2]}-${dm[1]}`,
          ket: cls.ket,
          kode: cls.kode,
          debet: isDB ? amt : 0,
          kredit: (isCR && !isDB) ? amt : (isDB ? 0 : amt)
        });
      }
    }
  });
  return { txs, saldoAwal, mutCR, mutDB, saldoAkhir };
}

async function generate() {
  const log = document.getElementById('logel');
  const genBtn = document.getElementById('genBtn');
  genBtn.disabled = true;
  log.innerHTML = "› Memulai pemrosesan...";

  const results = [];
  for (const f of Object.values(files)) {
    log.innerHTML += `<br>› Membaca ${f.name}...`;
    const text = await extractText(f);
    results.push(parseText(text));
  }

  // Build Excel (Menggunakan struktur skrip Python Anda)
  const wb = XLSX.utils.book_new();
  const data = [
    ['BCA 346-8383111'], ['CV. MITRA JAYA ANUGERAH'], ['TAHUN 2025'],
    ['+', '-', '-', '-', '-', '-', '-', '-', '-', '+'],
    ['|', 'NO', 'TANGGAL', 'NAMA', 'KETERANGAN', 'KODE', 'DEBET', 'KREDIT', 'SALDO', '|']
  ];

  let currentSaldo = results[0].saldoAwal;
  data.push(['|', '', '', '', 'SALDO AWAL', '', '', '', currentSaldo, '|']);

  results.forEach(res => {
    res.txs.forEach((tx, idx) => {
      currentSaldo += (tx.kredit - tx.debet);
      data.push(['|', idx + 1, tx.date, '', tx.ket, tx.kode, tx.debet || '', tx.kredit || '', currentSaldo.toFixed(2), '|']);
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(data);
  XLSX.utils.book_append_sheet(wb, ws, "bca");
  XLSX.writeFile(wb, "BANK2025_REVISED.xlsx");

  log.innerHTML += "<br>› Selesai! File diunduh.";
  genBtn.disabled = false;
}

// Handlers UI
document.getElementById('fi').addEventListener('change', e => {
  Array.from(e.target.files).forEach(f => { files[f.name] = f; });
  document.getElementById('genBtn').disabled = false;
  document.getElementById('stxt').innerText = Object.keys(files).length + " file siap.";
});
document.getElementById('genBtn').addEventListener('click', generate);
document.getElementById('clrBtn').addEventListener('click', () => location.reload());
</script>
